<div class="max-w-md mx-auto mt-10 text-center">
    <div class="h-60 overflow-y-auto p-2 mb-2 border">
        @for (msg of messages(); track msg) {
            <div class="bg-gray-200 p-2 mb-1 rounded">
                {{msg}}
            </div>
        }
    </div>
    
    <input type="text" placeholder="Write your message here" class="border p-2 w-full" #input (keyup.enter)="send(input.value) ; input.value=''">
    
</div>
